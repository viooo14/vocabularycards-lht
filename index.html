const UNAME = {"1":"Unit 1","2":"Unit 2","3":"Unit 3","4":"Unit 4","5":"Unit 5"};
let idx=0, revealed=false, timedOut=false, raf=null, tStart=0, okCount=0, noCount=0;
const forgot=[];
const DUR=7000;
const $=id=>document.getElementById(id);
$('total-n').textContent=DATA.length; $('q-total').textContent=DATA.length;

function startQuiz(){
  $('scr-start').style.display='none'; $('scr-quiz').style.display='block'; showWord();
}
function showWord(){
  const d=DATA[idx];
  revealed=false; timedOut=false;
  $('q-cur').textContent=idx+1;
  $('q-word').textContent=d.w;
  $('q-ans').style.display='none';
  $('q-phon').textContent=d.p; $('q-phon').style.display=d.p?'block':'none';
  $('q-pos').textContent=d.pos; $('q-def').textContent=d.d;
  $('q-hint').innerHTML='点击卡片查看答案（7 秒内作答可判「记得」）';
  $('q-hint').className='hint';
  $('btn-ok').disabled=false; $('btn-no').disabled=true;
  $('card').style.cursor='pointer';
  tStart=performance.now();
  cancelAnimationFrame(raf); tick();
}
function tick(){
  const el=performance.now()-tStart;
  $('t-bar').style.width=Math.max(0,100*(1-el/DUR))+'%';
  if(el>=DUR){ autoReveal(); return; }
  raf=requestAnimationFrame(tick);
}
function onCardClick(){
  if(revealed) return;
  cancelAnimationFrame(raf);
  reveal(false);
}
function autoReveal(){ reveal(true); }
function reveal(auto){
  revealed=true;
  $('q-ans').style.display='flex';
  $('btn-no').disabled=false;
  if(auto){
    timedOut=true;
    $('btn-ok').disabled=true;
    $('q-hint').innerHTML='<span class="warn">超时未作答，本词只能标记为「遗忘」</span>';
  }else{
    $('q-hint').textContent='现在做出判断：记得，还是遗忘？';
  }
  $('card').style.cursor='default';
}
function choose(ok){
  if(!revealed) return;
  const d=DATA[idx];
  if(ok && !timedOut){ okCount++; $('c-ok').textContent=okCount; }
  else{ noCount++; forgot.push(d); $('c-no').textContent=noCount; }
  idx++;
  if(idx>=DATA.length) showResult(); else showWord();
}
function showResult(){
  cancelAnimationFrame(raf);
  $('scr-quiz').style.display='none'; $('scr-result').style.display='block';
  $('r-ok').textContent=okCount; $('r-no').textContent=noCount;
  $('r-acc').textContent=Math.round(okCount/DATA.length*100)+'%';
  if(forgot.length===0){ $('r-empty').style.display='block'; $('r-table-wrap').style.display='none'; return; }
  forgot.sort((a,b)=> a.u===b.u ? a.ui-b.ui : (+a.u)-(+b.u));
  let html='', tsv='序号\t词汇\t词性\t词义\t来源单元\n';
  forgot.forEach((d,i)=>{
    html+='<tr><td class="num">'+(i+1)+'</td><td>'+esc(d.w)+'</td><td class="posw">'+esc(d.pos)+'</td><td>'+esc(d.d)+'</td><td>'+UNAME[d.u]+'</td></tr>';
    tsv+=(i+1)+'\t'+d.w+'\t'+d.pos+'\t'+d.d+'\t'+UNAME[d.u]+'\n';
  });
  $('r-tbody').innerHTML=html; window._tsv=tsv;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyForgot(){
  const t=window._tsv||'';
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>{alert('已复制到剪贴板');},()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');alert('已复制到剪贴板');}catch(e){}
  document.body.removeChild(ta);
}
document.addEventListener('keydown',e=>{
  if($('scr-quiz').style.display!=='block') return;
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(!revealed) onCardClick(); }
  else if(revealed && (e.key==='1'||e.key==='ArrowLeft')){ if(!$('btn-ok').disabled) choose(true); }
  else if(revealed && (e.key==='2'||e.key==='ArrowRight')){ choose(false); }
});
</script>
